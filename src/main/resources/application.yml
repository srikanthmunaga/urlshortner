server:
  port: 8080

spring:
  application:
    name: url-shortener
  datasource:
    url: jdbc:h2:file:./data/urlshortener;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  cache:
    cache-names: shortUrlCache
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m

app:
  base-url: http://localhost:8080
  short-code:
    length: 7
  rate-limit:
    capacity: 20
    refill-tokens: 20
    refill-duration-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
